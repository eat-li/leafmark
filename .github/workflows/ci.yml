name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: leafmark/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: leafmark
        run: pnpm install --frozen-lockfile

      - name: Type check
        working-directory: leafmark
        run: pnpm typecheck

      - name: Lint
        working-directory: leafmark
        run: pnpm lint
